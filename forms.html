<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/css/mystyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form</title>
</head>
<body>
    <div class="form-container">
        <h2>Student Registration</h2>
        <p>Please fill in your details below</p>
        <form action="">
            <div class="form-group">
                <label for="">Full Name</label>
                <input type="text" placeholder="Enter Full Name" required>
            </div>
            <div class="form-group">
                <label for="">Email</label>
            <input type="email" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
                <label for=""> Date of Birth</label>
                <input type="date" required> 
            </div>
            <div class="form-group">
                <label for="">Phone Number </label>
                <input type="text" placeholder="Enter phone no" required>
            </div>
            <div class="form-group">
                <label class="lab" for="">Gender</label>
                <label for="">Male</label>
                <input type="radio" name="gender" id="">
                <label for="">Female</label>
                <input type="radio" name="gender">
                <label for="">Other</label>
                <input type="radio" name="gender">
                
                
                
            </div>
            <div class="form-group">
                <label for="">Courses</label>
                <select name="" id="">
                    <option value="js">Javascript</option>
                    <option value="web">Web development</option>
                    <option value="cyber">Cyber security</option>
                    <option value="DS">Data Science</option>
                    <option value="">Mobile App Development</option>
                </select>
            </div>
            <div class="form-group">
                <label for="">Address</label>
                <textarea placeholder="Enter Your Address" name="Address" id=""></textarea>
            </div>
            <div class="form-group">
                <label for="">Parent/Guadian email</label>
                <input type="email" placeholder="enter email" required>
            </div>
            <div class="form-group">
                <label for="">Parent/guadian contact no.</label>
                <input type="text" placeholder="enter contact no." required>
            </div>
            <div class="form-group">
                <label for="">Time Allocation</label>
               <select name="" id="">
                 <option value="">Morning</option>
                <option value="">Mid Morning</option>
                <option value="">Afternoon</option>
               </select>

            </div>
            <button class="btn">Register Student</button>
            
                 
            
        </form>
    </div>   
</body>
</html>
