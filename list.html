<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
  <h2>List of cars</h2>
  <h2>Ordered list</h2>
  <ol>
    <li>Mercedes</li>
    <li>Toyota</li>
    <li>Subaru</li>
    <li>Mazda</li>
    <li>Porshe</li>
  </ol>
  <div class="dark">
    <h2>List of Fruits</h2>  
  <h2>Unordered list</h2>
  </div>
  <ul>
    <li>Banana</li>
    <li>Mango</li>
    <li>Passion</li>
    <li>Oranges</li>
    <li>Pineapples</li>
    <li>Apples</li>
  </ul>
  <h2>Description list</h2>
  <ul>
    <dt>coffee</dt>
    <dd>black hot drink</dd>
    <dt>milk</dt>
    <dd>white cold drink</dd>
  </ul>

</body>
</html>
